[package]
name = "satconverter"
version = "0.1.1"
description = "A lightweight desktop converter for instant sats, BTC, EUR and USD conversions with live Bitcoin prices."
authors = ["Loïc Morel"]
license = "Unlicense"
repository = "https://github.com/LoicPandul/SatConverter"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
# wayland-data-control : presse-papiers natif Wayland sur Linux (X11 inclus de base) ;
# default-features off pour exclure image-data (copie de texte uniquement).
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

# Smallest, fastest possible release binary.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
